spring:
  application:
    name: oriweb

  # 기본값은 로컬(IntelliJ) 실행 기준, Docker에서는 환경변수로 덮어씀
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oriweb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oriweb}
    password: ${DB_PASSWORD:oriweb}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
