spring:
  application:
    name: oriweb

  # Defaults are for local (IntelliJ) runs; Docker overrides them with environment variables
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oriweb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oriweb}
    password: ${DB_PASSWORD:oriweb}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

  # GitHub OAuth App credentials come only from environment variables (.env). If unset, the GitHub login button is hidden
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:unset}
            client-secret: ${GITHUB_CLIENT_SECRET:unset}
            scope: read:user

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Admin account (optional). Created on startup if set and the account does not exist yet (AdminInitializer)
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

# Spring Boot Actuator: expose only health and info over HTTP
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OriWeb
    description: 모의해킹 실습용 게시판

springdoc:
  swagger-ui:
    path: /swagger-ui.html
