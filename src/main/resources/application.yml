spring:
  application:
    name: oriweb

  # 기본값은 로컬(IntelliJ) 실행 기준, Docker에서는 환경변수로 덮어씀
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oriweb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oriweb}
    password: ${DB_PASSWORD:oriweb}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

  # GitHub OAuth App 정보는 환경변수(.env)로만 주입. 설정하지 않으면 GitHub 로그인 버튼이 숨겨짐
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:unset}
            client-secret: ${GITHUB_CLIENT_SECRET:unset}
            scope: read:user

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
