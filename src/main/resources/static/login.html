<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriWeb - 로그인</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>로그인</h1>
    <form class="box" id="login-form">
      <label for="username">ID</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p class="error" id="error"></p>
      <button type="submit" class="primary">로그인</button>
      <a class="button" href="/oauth2/authorization/github" id="github-login" hidden>GitHub로 로그인</a>
      <p class="muted">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script>
    renderHeader();

    // Show the button only when a GitHub OAuth App is configured
    api('GET', '/api/auth/oauth-providers')
      .then(providers => { document.getElementById('github-login').hidden = !providers.github; })
      .catch(() => {});

    if (getParam('error') === 'oauth') {
      document.getElementById('error').textContent = 'GitHub 로그인에 실패했습니다.';
    } else if (getParam('error') === 'suspended') {
      document.getElementById('error').textContent = '정지된 계정입니다. 관리자에게 문의하세요.';
    }

    document.getElementById('login-form').onsubmit = async (event) => {
      event.preventDefault();
      try {
        await api('POST', '/api/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        });
        // 허용된 내부 경로로만 이동 (오픈 리다이렉트 방지)
        const allowedPaths = ['/', '/index.html', '/post.html', '/write.html', '/admin.html'];
        const input = getParam('redirect');
        let target = '/';
        if (input) {
          try {
            const url = new URL(input, location.origin);
            // 동일 출처이고 허용 경로일 때만 이동 (백슬래시/프로토콜 상대 URL 등 우회 입력 차단)
            if (url.origin === location.origin && allowedPaths.includes(url.pathname)) {
              target = url.pathname + url.search;
            }
          } catch (e) { /* 잘못된 URL은 기본 경로로 */ }
        }
        location.href = target;
      } catch (e) {
        document.getElementById('error').textContent = e.message;
      }
    };
  </script>
</body>
</html>
