<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriWeb - 회원가입</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>회원가입</h1>
    <form class="box" id="signup-form">
      <label for="username">아이디 <span class="muted">(영문/숫자 4~20자)</span></label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">비밀번호 <span class="muted">(4~50자)</span></label>
      <input type="password" id="password" autocomplete="new-password" required>
      <label for="password-confirm">비밀번호 확인</label>
      <input type="password" id="password-confirm" autocomplete="new-password" required>
      <p class="error" id="error"></p>
      <button type="submit" class="primary">가입하기</button>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script>
    renderHeader();

    document.getElementById('signup-form').onsubmit = async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('password-confirm').value) {
        error.textContent = '비밀번호가 일치하지 않습니다.';
        return;
      }
      try {
        await api('POST', '/api/auth/signup', {
          username: document.getElementById('username').value,
          password,
        });
        alert('가입이 완료되었습니다. 로그인해주세요.');
        location.href = '/login.html';
      } catch (e) {
        error.textContent = e.message;
      }
    };
  </script>
</body>
</html>
