<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriWeb - 게시판</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <table>
      <thead>
        <tr>
          <th class="num"><img src="/images/lily-pad.svg" alt="번호" title="번호"></th>
          <th>제목</th>
          <th class="author">작성자</th>
          <th class="date">작성일</th>
        </tr>
      </thead>
      <tbody id="post-list"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>

    <div class="actions">
      <a class="button" href="/write.html" id="write-button" hidden>글쓰기</a>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const me = await renderHeader();
      if (me) document.getElementById('write-button').hidden = false;

      const page = Number(getParam('page') || 0);
      const data = await api('GET', `/api/posts?page=${page}&size=10`);

      const tbody = document.getElementById('post-list');
      if (data.content.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="muted">게시글이 없습니다.</td></tr>';
      }
      // 번호는 DB ID가 아니라 순번 (최신 글이 가장 큰 번호). 게시글 수가 3999개로 제한되므로 항상 로마 숫자로 표시됨
      data.content.forEach((post, index) => {
        const number = data.totalElements - data.page * data.size - index;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="num"></td>
          <td><a></a></td>
          <td class="author"></td>
          <td class="date"></td>`;
        tr.children[0].textContent = toRoman(number);
        tr.querySelector('a').textContent = post.title;
        tr.querySelector('a').href = `/post.html?id=${post.id}`;
        tr.children[2].textContent = post.authorUsername;
        tr.children[3].textContent = formatDate(post.createdAt);
        tbody.append(tr);
      });

      const pagination = document.getElementById('pagination');
      for (let i = 0; i < data.totalPages; i++) {
        const link = document.createElement(i === page ? 'span' : 'a');
        link.textContent = i + 1;
        if (i === page) link.className = 'current';
        else link.href = `/?page=${i}`;
        pagination.append(link);
      }
    })();
  </script>
</body>
</html>
