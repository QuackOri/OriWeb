<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriWeb - 글쓰기</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1 id="page-title">글쓰기</h1>
    <form id="post-form">
      <p><label for="title">제목</label></p>
      <input type="text" id="title" maxlength="200" required>

      <p><label for="content">내용</label></p>
      <textarea id="content" required></textarea>

      <section id="existing-section" hidden>
        <h2>기존 첨부파일</h2>
        <ul class="plain" id="existing-list"></ul>
      </section>

      <p><label for="files">첨부파일 추가</label> <span class="muted">(파일당 최대 10MB)</span></p>
      <input type="file" id="files" multiple>

      <p class="error" id="error"></p>
      <div class="actions">
        <button type="submit" class="primary" id="submit-button">등록</button>
        <a class="button" id="cancel-button" href="/">취소</a>
      </div>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const postId = getParam('id');

    function renderExisting(attachments) {
      const list = document.getElementById('existing-list');
      list.innerHTML = '';
      document.getElementById('existing-section').hidden = attachments.length === 0;
      for (const file of attachments) {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = `${file.originalName} (${formatSize(file.size)})`;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'link';
        remove.textContent = '삭제';
        remove.onclick = async () => {
          if (!confirm(`${file.originalName} 파일을 삭제할까요?`)) return;
          try {
            await api('DELETE', `/api/attachments/${file.id}`);
            renderExisting(await api('GET', `/api/posts/${postId}/attachments`));
          } catch (e) {
            alert(e.message);
          }
        };
        li.append(name, remove);
        list.append(li);
      }
    }

    (async () => {
      const me = await renderHeader();
      if (!requireLogin(me)) return;

      // Edit mode: load the existing post
      if (postId) {
        const post = await api('GET', `/api/posts/${postId}`);
        if (post.authorId !== me.id) {
          alert('게시글 작성자만 수정할 수 있습니다.');
          location.href = `/post.html?id=${postId}`;
          return;
        }
        document.title = 'OriWeb - 글 수정';
        document.getElementById('page-title').textContent = '글 수정';
        document.getElementById('submit-button').textContent = '수정';
        document.getElementById('cancel-button').href = `/post.html?id=${postId}`;
        document.getElementById('title').value = post.title;
        document.getElementById('content').value = post.content;
        renderExisting(post.attachments);
      }

      document.getElementById('post-form').onsubmit = async (event) => {
        event.preventDefault();
        const error = document.getElementById('error');
        const submit = document.getElementById('submit-button');
        const body = {
          title: document.getElementById('title').value,
          content: document.getElementById('content').value,
        };

        submit.disabled = true;
        try {
          // 1) Save the post -> 2) upload attachments if any files are selected
          const post = postId
            ? await api('PUT', `/api/posts/${postId}`, body)
            : await api('POST', '/api/posts', body);

          const files = document.getElementById('files').files;
          if (files.length > 0) {
            const formData = new FormData();
            for (const file of files) formData.append('files', file);
            try {
              await api('POST', `/api/posts/${post.id}/attachments`, formData);
            } catch (e) {
              alert(`게시글은 저장되었지만 파일 업로드에 실패했습니다: ${e.message}`);
            }
          }
          location.href = `/post.html?id=${post.id}`;
        } catch (e) {
          error.textContent = e.message;
          submit.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
