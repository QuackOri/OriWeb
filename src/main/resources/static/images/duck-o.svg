<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 112" role="img" aria-label="O">
  <!-- Side view of a duck facing left. The round body acts as the letter O -->

  <!-- Legs (behind the body) -->
  <path d="M64 94 L62 106 L52 109 M62 106 L70 109" fill="none" stroke="#ff9a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 94 L82 106 L72 109 M82 106 L90 109" fill="none" stroke="#ff9a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head, neck, body and tail drawn as one smooth silhouette (no seams) -->
  <path d="M36 6
           C24 6 18 15 20 24
           C22 34 28 42 30 54
           C31 80 50 98 72 98
           C94 98 106 86 108 70
           L120 46
           C110 50 100 48 92 44
           C78 38 62 38 54 32
           C50 28 51 18 49 13
           C46 8 42 6 36 6 Z"
        fill="#ffd84d" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wing -->
  <path d="M62 64 C72 54 92 56 102 70 C90 80 72 78 62 64 Z" fill="#f2bf2a" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Flat bill (left) -->
  <path d="M22 19 C14 18 4 21 3 25 C6 29 15 29 22 28 Z" fill="#ff9a1f" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="33" cy="15" r="2.8" fill="#141414"/>
</svg>
