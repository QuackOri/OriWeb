# Intentionally vulnerable training app: ports are bound to 127.0.0.1 only to prevent external exposure
# DB credentials are dummy values for local practice only

services:
  db:
    image: mysql:8.4
    container_name: oriweb-db
    environment:
      MYSQL_DATABASE: oriweb
      MYSQL_USER: oriweb
      MYSQL_PASSWORD: oriweb
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uoriweb", "-poriweb"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: oriweb-app
    environment:
      DB_URL: jdbc:mysql://db:3306/oriweb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: oriweb
      DB_PASSWORD: oriweb
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Seoul
      # GitHub OAuth login (optional). Set values in .env to enable (see .env.example)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-unset}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-unset}
      # Admin account (optional). Created on startup when set in .env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - upload-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  upload-data:
